# Einmalige Diagnose zur Frage, warum die Wache null Eintraege sieht.
# Nur von Hand auszuloesen, kein Zeitplan. Wird nach der Klaerung
# wieder entfernt - eine Diagnose, die liegen bleibt, wird irgendwann
# fuer eine Pruefung gehalten.
name: Diagnose newsletter.json

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Was bekommt der Runner wirklich?
        run: python .github/wache/diagnose_newsletter.py
